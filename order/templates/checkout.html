{% extends "base.html" %}
{% load static %}
{% block title %}Order #{{ order.id }}{% endblock %}
{% block content %}
<style>
.payment-box {
    width: 400px;
    height: 300px;
    margin: 40px auto;
    padding: 30px;
    background: rgb(203, 212, 212);
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
}

.payment-box h3 {
    color: #403e3e;
}

.payment-box-total {
    display: flex;
    justify-content: space-between;
    margin-top: 25px;
    font-size: 20px;
}

.payment-box button {
    width: 100%;
    padding: 12px;
    margin-top: 60px;
}
</style>

<div class="container py-5">
<div class="payment-box">
<h3 class="text-center mt3">pay your Amount </h3>
<h3 class="text-start mt-3 total">Total: ₹{{ total}}</h3>
<form method="POST">
    {%csrf_token%}
    <button type="submit" class="btn btn-primary">place an order</button>
    
</form>
</div>
</div>
{% endblock %}
