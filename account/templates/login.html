{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container py-5"><div class="auth-card mx-auto"><h2>Login</h2>
<form method="post" class="mt-4">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary w-100">Login</button></form>
<p class="mt-3">New user? <a href="{% url 'account:signup' %}">Create account</a></p>
</div></div>
{% endblock %}
