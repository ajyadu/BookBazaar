{% extends "base.html" %}
{% block title %}Signup{% endblock %}
{% block content %}
<div class="container py-5"><div class="auth-card mx-auto"><h2>Create Account</h2>
<form method="post" class="mt-4">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary w-100">Signup</button></form>
<p class="mt-3">Already have an account? <a href="{% url 'account:login' %}">Login</a></p>
</div></div>
{% endblock %}
